# Inspired by Andrew6rant (https://github.com/Andrew6rant/Andrew6rant)
name: Update Profile Stats

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore LOC cache
        uses: actions/cache@v4
        with:
          path: cache
          key: loc-cache-${{ github.run_id }}
          restore-keys: |
            loc-cache-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate profile SVGs
        run: python update.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update profile stats"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
